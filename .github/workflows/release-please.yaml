name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # A GitHub App token (rather than the default GITHUB_TOKEN) is used so the
      # release PR triggers CI like a normal PR. HELPER_APP_ID and
      # HELPER_APP_PRIVATE_KEY are the org helper-app credentials already used
      # by sibling repos; they are not Marketplace publisher credentials.
      - name: Generate GitHub App Token
        id: generate-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.HELPER_APP_ID }}
          private-key: ${{ secrets.HELPER_APP_PRIVATE_KEY }}

      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ steps.generate-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          # Repo default is still initialdev. Without this, release-please
          # would open/groom the release PR against initialdev even on a
          # push to main.
          target-branch: ${{ github.ref_name }}

      - uses: actions/checkout@v7
        if: ${{ steps.release.outputs.release_created }}

      - uses: actions/setup-node@v7
        if: ${{ steps.release.outputs.release_created }}
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - name: Install dependencies
        if: ${{ steps.release.outputs.release_created }}
        run: npm ci

      - name: Package VSIX
        if: ${{ steps.release.outputs.release_created }}
        run: npm run package

      - name: Upload VSIX
        if: ${{ steps.release.outputs.release_created }}
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
        run: gh release upload ${{ steps.release.outputs.tag_name }} *.vsix
