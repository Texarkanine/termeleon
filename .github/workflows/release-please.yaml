name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Generate GitHub App Token
        id: generate-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.DOGGO_BOT_APP_ID }}
          private-key: ${{ secrets.DOGGO_BOT_PRIVATE_KEY }}

      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ steps.generate-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - uses: actions/checkout@v7
        if: ${{ steps.release.outputs.release_created }}

      - uses: actions/setup-node@v7
        if: ${{ steps.release.outputs.release_created }}
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - name: Install dependencies
        if: ${{ steps.release.outputs.release_created }}
        run: npm ci

      - name: Package VSIX
        if: ${{ steps.release.outputs.release_created }}
        run: npm run package

      - name: Upload VSIX
        if: ${{ steps.release.outputs.release_created }}
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
        run: gh release upload ${{ steps.release.outputs.tag_name }} *.vsix

  publish-openvsx:
    name: Publish to Open VSX
    runs-on: ubuntu-latest
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    environment:
      name: open-vsx.org
      url: https://open-vsx.org/extension/texarkanine/termeleon
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Package VSIX
        run: npm run package

      - name: Publish to Open VSX
        env:
          OPENVSX_TOKEN: ${{ secrets.OPENVSX_TOKEN }}
        run: npx --yes ovsx publish *.vsix --pat "$OPENVSX_TOKEN"
