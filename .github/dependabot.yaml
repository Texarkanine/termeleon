version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
    groups:
      production-deps:
        dependency-type: production
        update-types:
          - minor
          - patch
      development-deps:
        dependency-type: development
        update-types:
          - minor
          - patch
    open-pull-requests-limit: 10
    assignees:
      - Texarkanine
    commit-message:
      prefix: fix(deps)
      prefix-development: chore(deps-dev)
    ignore:
      # TS 7 is the native Go compiler; breaks existing tsconfig until deliberate migration.
      - dependency-name: "typescript"
        versions: [">=7.0.0"]
      # @types/node major should track .nvmrc (Node 22), not the latest Node release.
      - dependency-name: "@types/node"
        versions: [">=23.0.0"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    open-pull-requests-limit: 5
    assignees:
      - Texarkanine
    commit-message:
      prefix: chore(deps-ci)
